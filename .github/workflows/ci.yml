name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    defaults:
      run:
        working-directory: finance-crypto
    steps:
      - name: Check out this library
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: finance-crypto
          persist-credentials: false
      - name: Install native build dependencies and refinement solver
        run: brew install blake3 zstd brotli openssl@3 pkg-config z3 ripgrep
      - name: Install March 0.5.0
        run: |
          # Direct release URLs avoid shared-runner API limits. BSD sha256sum
          # lacks --ignore-missing, so verify the single archive with shasum.
          base=https://github.com/march-language/march/releases/download/v0.5.0
          archive=march-v0.5.0-darwin-arm64.tar.gz
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$base/march-v0.5.0-checksums.txt" --output march-checksums.txt
          sed 's/^sha256://' march-checksums.txt | \
            awk -v archive="$archive" '$2 == archive { print }' > march-checksum.txt
          test "$(wc -l < march-checksum.txt | tr -d ' ')" -eq 1
          shasum -a 256 --check march-checksum.txt
          mkdir -p "$HOME/.march/versions/v0.5.0"
          tar -xzf "$archive" --strip-components=1 -C "$HOME/.march/versions/v0.5.0"
          ln -sfn versions/v0.5.0 "$HOME/.march/current"
          echo "$HOME/.march/versions/v0.5.0/bin" >> "$GITHUB_PATH"
      - name: Verify pinned toolchain
        run: |
          march --version
          forge --version
          forge toolchain which
          test "$(march --version)" = "march 0.5.0"
      - name: Check and build
        run: |
          forge deps
          forge check
          forge build --release
      - name: Debug tests and properties
        run: forge test --seed=42
      - name: Release tests and properties
        run: forge test --release --seed=20261014
      - name: Compile-time contract checks
        run: sh scripts/check-contracts.sh
